<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="790" viewBox="0 0 1080 790" font-family="Helvetica, Arial, sans-serif">
  <rect width="1080" height="790" fill="#ffffff"/>

  <text x="40" y="44" font-size="21" font-weight="700" fill="#14213d">Theoretical lateral resolution at the retina, 0.5 mm beam, 840 nm</text>
  <text x="40" y="68" font-size="13.5" fill="#5a6472">Schematic mouse eye. Convergence angle drawn to scale; lengths along the axis are to scale; the eye itself is schematic.</text>

  <!-- ===================== optical diagram ===================== -->
  <!-- scale: 168 px per mm, both axes. axis y = 265, lens plane x = 380, retina x = 700 (f = 1.9 mm) -->

  <!-- optic axis -->
  <line x1="60" y1="265" x2="780" y2="265" stroke="#b9c0cc" stroke-width="1" stroke-dasharray="7 5"/>

  <!-- iris / pupil stop: dilated pupil 2 mm => +/- 168 px -->
  <rect x="373" y="63" width="14" height="34" fill="#2b3a55"/>
  <rect x="373" y="433" width="14" height="34" fill="#2b3a55"/>
  <line x1="380" y1="97" x2="380" y2="433" stroke="#2b3a55" stroke-width="1" stroke-dasharray="3 4" opacity="0.45"/>
  <text x="396" y="84" font-size="12.5" fill="#2b3a55">iris</text>
  <text x="396" y="459" font-size="12.5" fill="#2b3a55">iris</text>

  <!-- cornea + lens as one converging element -->
  <path d="M 380 110 C 336 175, 336 355, 380 420 C 424 355, 424 175, 380 110 Z" fill="#cfe3f7" fill-opacity="0.75" stroke="#3b7dd8" stroke-width="2"/>
  <text x="330" y="103" font-size="12.5" fill="#3b7dd8">cornea + lens</text>

  <!-- retina -->
  <path d="M 700 105 C 742 190, 742 340, 700 425" fill="none" stroke="#d0574f" stroke-width="3"/>
  <text x="712" y="99" font-size="12.5" fill="#d0574f">retina</text>

  <!-- incoming collimated beam, D = 0.5 mm => +/- 42 px -->
  <rect x="60" y="223" width="320" height="84" fill="#f2c14e" fill-opacity="0.30"/>
  <line x1="60" y1="223" x2="380" y2="223" stroke="#c9971b" stroke-width="2"/>
  <line x1="60" y1="307" x2="380" y2="307" stroke="#c9971b" stroke-width="2"/>
  <text x="66" y="212" font-size="12.5" fill="#8a6708">collimated sample beam, 840 nm</text>

  <!-- converging cone -->
  <path d="M 380 223 L 700 265 L 380 307 Z" fill="#f2c14e" fill-opacity="0.22"/>
  <line x1="380" y1="223" x2="700" y2="265" stroke="#c9971b" stroke-width="2"/>
  <line x1="380" y1="307" x2="700" y2="265" stroke="#c9971b" stroke-width="2"/>

  <!-- half angle theta at the focus -->
  <path d="M 630 257 A 72 72 0 0 1 630 273" fill="none" stroke="#14213d" stroke-width="1.4"/>
  <text x="588" y="252" font-size="13" fill="#14213d" font-style="italic">&#952;</text>

  <!-- D dimension -->
  <line x1="150" y1="223" x2="150" y2="307" stroke="#14213d" stroke-width="1.2"/>
  <path d="M 146 227 L 150 220 L 154 227 Z" fill="#14213d"/>
  <path d="M 146 303 L 150 310 L 154 303 Z" fill="#14213d"/>
  <text x="160" y="258" font-size="13" fill="#14213d"><tspan font-style="italic">D</tspan> = 0.5 mm</text>
  <text x="160" y="276" font-size="11.5" fill="#5a6472">1/e&#178; diameter at the cornea</text>

  <!-- pupil dimension -->
  <line x1="342" y1="97" x2="342" y2="433" stroke="#2b3a55" stroke-width="1.2"/>
  <path d="M 338 101 L 342 94 L 346 101 Z" fill="#2b3a55"/>
  <path d="M 338 429 L 342 436 L 346 429 Z" fill="#2b3a55"/>
  <text x="196" y="400" font-size="12.5" fill="#2b3a55">dilated pupil &#8776; 2 mm</text>
  <text x="196" y="417" font-size="11.5" fill="#5a6472">the beam underfills it, so</text>
  <text x="196" y="433" font-size="11.5" fill="#5a6472">NA is well below the eye's 0.49</text>

  <!-- f dimension -->
  <line x1="380" y1="500" x2="700" y2="500" stroke="#14213d" stroke-width="1.2"/>
  <path d="M 384 496 L 377 500 L 384 504 Z" fill="#14213d"/>
  <path d="M 696 496 L 703 500 L 696 504 Z" fill="#14213d"/>
  <line x1="380" y1="425" x2="380" y2="506" stroke="#14213d" stroke-width="0.8" stroke-dasharray="3 4"/>
  <line x1="700" y1="425" x2="700" y2="506" stroke="#14213d" stroke-width="0.8" stroke-dasharray="3 4"/>
  <text x="446" y="521" font-size="13" fill="#14213d"><tspan font-style="italic">f</tspan> = 1.78 to 1.95 mm</text>
  <text x="404" y="538" font-size="11.5" fill="#5a6472">posterior nodal distance, Schmucker and Schaeffel 2004</text>

  <!-- ===================== inset: the spot ===================== -->
  <rect x="800" y="95" width="242" height="330" rx="8" fill="#fbfcfe" stroke="#d3d9e3"/>
  <text x="818" y="121" font-size="13.5" font-weight="700" fill="#14213d">Spot at the retina</text>

  <line x1="820" y1="300" x2="1022" y2="300" stroke="#b9c0cc" stroke-width="1"/>
  <path d="M 830 300 C 880 300, 890 155, 921 155 C 952 155, 962 300, 1012 300" fill="#f2c14e" fill-opacity="0.28" stroke="#c9971b" stroke-width="2"/>

  <!-- 1/e2 level -->
  <line x1="845" y1="280" x2="997" y2="280" stroke="#3b7dd8" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="880" y1="280" x2="962" y2="280" stroke="#3b7dd8" stroke-width="2.4"/>
  <path d="M 884 276 L 877 280 L 884 284 Z" fill="#3b7dd8"/>
  <path d="M 958 276 L 965 280 L 958 284 Z" fill="#3b7dd8"/>
  <text x="1002" y="284" font-size="11" fill="#3b7dd8" text-anchor="end">1/e&#178;</text>

  <!-- FWHM level -->
  <line x1="845" y1="228" x2="997" y2="228" stroke="#7a3fb5" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="897" y1="228" x2="945" y2="228" stroke="#7a3fb5" stroke-width="2.4"/>
  <path d="M 901 224 L 894 228 L 901 232 Z" fill="#7a3fb5"/>
  <path d="M 941 224 L 948 228 L 941 232 Z" fill="#7a3fb5"/>
  <text x="1002" y="232" font-size="11" fill="#7a3fb5" text-anchor="end">half max</text>

  <text x="818" y="332" font-size="12.5" fill="#3b7dd8">1/e&#178; diameter 2<tspan font-style="italic">w</tspan>&#8320; = 3.8 to 4.2 &#181;m</text>
  <text x="818" y="352" font-size="12.5" fill="#7a3fb5">FWHM = 2.3 to 2.5 &#181;m</text>
  <text x="818" y="378" font-size="11.5" fill="#5a6472">OCT papers quote the 1/e&#178; diameter,</text>
  <text x="818" y="394" font-size="11.5" fill="#5a6472">so approximately 4 &#181;m is the number</text>
  <text x="818" y="410" font-size="11.5" fill="#5a6472">to report.</text>

  <!-- ===================== the arithmetic ===================== -->
  <line x1="40" y1="566" x2="1042" y2="566" stroke="#e2e6ec"/>

  <text x="40" y="596" font-size="14" font-weight="700" fill="#14213d">Step 1. Numerical aperture set by the beam, not by the pupil</text>
  <text x="40" y="620" font-size="14" fill="#2b3a55" font-family="Georgia, serif">NA = sin(arctan(<tspan font-style="italic">D</tspan>/2<tspan font-style="italic">f</tspan>)) = sin(arctan(0.25 / 1.78)) = 0.139&#160;&#160;&#160;to&#160;&#160;&#160;sin(arctan(0.25 / 1.95)) = 0.127</text>
  <text x="40" y="641" font-size="11.5" fill="#5a6472">Check: the same expression with a 2 mm pupil and f = 1.78 mm gives NA = 0.490, which reproduces the 0.49 Geng et al. 2011 report for the fully dilated eye.</text>

  <text x="40" y="678" font-size="14" font-weight="700" fill="#14213d">Step 2. Diffraction-limited Gaussian focus</text>
  <text x="40" y="702" font-size="14" fill="#2b3a55" font-family="Georgia, serif">2<tspan font-style="italic">w</tspan>&#8320; = 4&#955;<tspan font-style="italic">f</tspan> / &#960;<tspan font-style="italic">D</tspan> = 2&#955; / &#960;&#183;NA</text>
  <text x="40" y="726" font-size="14" fill="#2b3a55" font-family="Georgia, serif">= 4 (0.84 &#181;m)(1780 &#181;m) / &#960;(500 &#181;m) = 3.8 &#181;m&#160;&#160;&#160;to&#160;&#160;&#160;4 (0.84 &#181;m)(1950 &#181;m) / &#960;(500 &#181;m) = 4.2 &#181;m</text>
  <text x="40" y="750" font-size="11.5" fill="#5a6472">Diffraction alone is a fair assumption here: Geng et al. 2011 measured higher order RMS below &#955;/14 at a 0.6 mm pupil, which is diffraction-limited by the Mar&#233;chal criterion.</text>
  <text x="40" y="772" font-size="11.5" fill="#5a6472">Aberrations, tear film and defocus can only make the real spot larger, so 3.8 to 4.2 &#181;m is a lower bound.</text>
</svg>
